<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SpeakUp | Welcome Back</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <style>

        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-logo .logo-icon {
            display: inline-flex;
            margin-bottom: 12px;
        }

        .auth-logo h1 {
            font-size: 30px;
            margin: 0 0 8px;
        }

        .auth-logo p {
            color: #6b7280;
            margin: 0;
            font-size: 14px;
        }

        .auth-card {
            background: white;
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
        }

        .auth-field {
            margin-bottom: 20px;
        }

        .auth-field label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .auth-field input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px 15px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .auth-field input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .auth-button {
            width: 100%;
            border: none;
            cursor: pointer;
            padding: 15px;
            font-size: 15px;
            margin-top: 5px;
        }

        .auth-footer {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
            font-size: 14px;
        }

        .auth-footer a {
            color: #7c3aed;
            font-weight: 600;
            text-decoration: none;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
            text-decoration: none;
            font-size: 13px;
        }

    </style>

</head>


<body>

    <main class="auth-page">

        <div class="auth-container">


            <div class="auth-logo">

                <span class="logo-icon">
                    S
                </span>

                <h1>
                    Welcome back 👋
                </h1>

                <p>
                    Continue your SpeakUp journey.
                </p>

            </div>


            <div class="auth-card">

                <form
                    method="POST"
                    action="/login"
                >


                    <div class="auth-field">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="auth-field">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="primary-button auth-button"
                    >
                        Sign In →
                    </button>


                </form>


                <div class="auth-footer">

                    Don't have an account?

                    <a href="/signup">
                        Create one
                    </a>

                </div>

            </div>


            <a
                href="/"
                class="back-home"
            >
                ← Back to SpeakUp
            </a>


        </div>

    </main>

</body>

</html>
